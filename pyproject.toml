[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afd-ponto"
version = "0.1.0"
description = "Espelho de ponto a partir do AFD de relógios REP (Portarias 1510 e 671), com alertas da CLT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gustavo Henrique Rocha" }]
keywords = ["afd", "rep", "ponto", "clt", "portaria-671", "portaria-1510", "topdata"]

[project.scripts]
afd-ponto = "afd_ponto.__main__:main"

[tool.setuptools]
packages = ["afd_ponto"]
